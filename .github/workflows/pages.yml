name: Build Cloudflare site

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build _site
        run: python3 dev/build_site.py

      - name: Upload Pages artifact (optional CF / preview)
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
